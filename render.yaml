services:
  - type: web
    name: jobpilot-ai
    runtime: docker
    plan: 1c-2g
    region: singapore
    healthCheckPath: /api/health/ready
    preDeployCommand: alembic upgrade head
    disk:
      name: jobpilot-documents
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_ENABLED
        value: "true"
      - key: JOBPILOT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-postgres
          property: connectionString
      - key: STORAGE_ROOT
        value: /var/data
      - key: DATA_DIR
        value: /var/data/cache
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: GENERATED_DIR
        value: /var/data/generated
      - key: LOG_LEVEL
        value: INFO
      - key: TZ
        value: Asia/Kolkata
      - key: ALLOW_REAL_SUBMISSIONS
        value: "false"
      - key: AUTOMATION_ALLOWED_HOSTS
        value: ""
      - key: CAPTURE_AUTOMATION_SCREENSHOTS
        value: "false"
      - key: CORS_ORIGINS
        value: ""
      - key: JOBPILOT_OLLAMA_URL
        sync: false
      - key: JOBPILOT_OLLAMA_MODEL
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false

databases:
  - name: jobpilot-postgres
    plan: 0.5c-1g
    region: singapore
    databaseName: jobpilot
    user: jobpilot
    ipAllowList: []
